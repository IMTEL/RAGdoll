[project]
name = "RAGdoll"
version = "0.1.0"
description = "A FastAPI-based microservice that serves as the backend for a VR chatbot system designed for educational/training purposes. It implements a Retrieval-Augmented Generation (RAG) architecture to provide context-aware responses to users in VR environments."
readme = "README.md"
requires-python = "<3.13, >=3.12"
license = { file = "LICENSE" }
dependencies = [
    "fastapi==0.143.0",
    "flask==3.1.3",
    "nltk>=3.9.2",
    "numpy==2.5.4",
    "openai==3.29.0",
    "openai-whisper==20250625",
    "pydantic==2.14.1",
    "pymongo==4.18.3",
    "python-dotenv==1.2.4",
    "python-multipart>=0.0.20",
    "requests>=2.32.3",
    "scipy==1.18.1",
    "soundfile>=0.13.1",
    "torch==2.14.1",
    "typer>=0.19.2",
    "unstructured[all-docs]>=0.18.15",
    "uvicorn==0.54.0",
    "cryptography>=46.0.2",
    "pyjwt[crypto]>=1.7.1",
    "faiss-cpu>=1.8.0",
    "scikit-learn>=1.5.0",
    "faster-whisper>=1.1.1",
    "piper-tts>=1.4.2",
    "pypinyin>=0.53.0",
    "google-genai>=2.29.0",
    "argon2-cffi>=25.1.0",
]

[dependency-groups]
dev = [
    "deptry>=0.23.1",
    "mongomock>=4.3.0",
    "mypy>=1.18.2",
    "pre-commit>=4.3.0",
    "pytest>=8.3.4",
    "pytest-cov>=6.0.0",
    "pytest-env>=1.2.0",
    "ruff>=0.13.1",
]
[tool.uv.sources]
torch = [
  { index = "pytorch-cpu" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.pytest.ini_options]
pythonpath = [".", "src"]
markers = [
    "integration: marks tests as integration tests that may require external resources",
    "unit: marks tests as unit tests that should not require external resources",
    "asyncio: marks tests as asyncio tests",
]
addopts = "--cov=src --cov-report=term-missing"

[tool.pytest_env]
RUNNING_TESTS = "true"

[tool.coverage.run]
omit = [
    "*/rag_service/context.py",
    "*/prompt_assemble.py",
    "*/command.py",
    "*/rag.py",
    "*/config.py",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover", # exclude lines with this comment
]
